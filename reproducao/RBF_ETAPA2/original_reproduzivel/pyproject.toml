[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isdbd"
version = "0.0.0"
description = "Thermodynamic and diffusive regimes in passive membrane permeation"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "matplotlib",
  "h5py",
  "PyYAML",
  "numba",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
